name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-dmg:
    name: Build and Release DMG (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            REF_NAME="${GITHUB_REF_NAME:-manual}"
          else
            REF_NAME="${GITHUB_REF_NAME}"
          fi
          VERSION="${REF_NAME#v}"
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build app (Release)
        run: |
          xcodebuild \
            -project Baguette.xcodeproj \
            -scheme Baguette \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            build

      - name: Create DMG
        id: dmg
        run: |
          APP_PATH=".build/DerivedData/Build/Products/Release/Baguette.app"
          ./Scripts/create_dmg.sh "$APP_PATH" "${{ steps.version.outputs.version }}"
          DMG_PATH="dist/Baguette-${{ steps.version.outputs.version }}-macos-arm64.dmg"
          CHECKSUM_PATH="${DMG_PATH}.sha256"
          shasum -a 256 "$DMG_PATH" > "$CHECKSUM_PATH"
          echo "dmg_path=${DMG_PATH}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${CHECKSUM_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.checksum_path }}
